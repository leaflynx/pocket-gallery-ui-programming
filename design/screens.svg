<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
<style>text{font-family:Arial,sans-serif;fill:#163047} .heading{font-weight:bold;font-size:22px}.label{font-size:16px}.muted{font-size:13px;fill:#486075}.phone{fill:#fff;stroke:#163047;stroke-width:3}.line{stroke:#95a8b7;stroke-width:2}.blue{fill:#e7f2fa}.gold{fill:#fff3d9}.button{fill:#164a69}.white{fill:#fff}</style>
<rect width="960" height="640" fill="#f5f8fa"/>
<text x="46" y="48" class="heading">Pocket Gallery — initial screen sketches</text>
<text x="46" y="70" class="muted">Search → artwork detail → saved works. These sketches preceded the screen code.</text>
<g transform="translate(50 100)">
<rect class="phone" width="250" height="490" rx="24"/>
<text x="20" y="38" class="heading">Explore</text>
<rect class="blue" x="16" y="60" width="218" height="48" rx="12"/><text x="28" y="90" class="label">Search artworks...</text>
<text x="20" y="138" class="muted">Search after a pause · 20 per page</text>
<rect class="gold" x="16" y="158" width="218" height="115" rx="10"/><rect class="blue" x="27" y="169" width="85" height="93" rx="6"/><text x="125" y="191" class="label">Artwork</text><text x="125" y="215" class="muted">Artist</text><text x="125" y="238" class="muted">Year</text>
<rect class="gold" x="16" y="287" width="218" height="115" rx="10"/><rect class="blue" x="27" y="298" width="85" height="93" rx="6"/><text x="125" y="320" class="label">Artwork</text><text x="125" y="344" class="muted">Artist</text>
<text x="50" y="440" class="label">Explore     Saved</text>
</g>
<g transform="translate(355 100)">
<rect class="phone" width="250" height="490" rx="24"/>
<text x="18" y="38" class="label">← Back</text>
<rect class="blue" x="16" y="58" width="218" height="198" rx="10"/><text x="63" y="163" class="label">Large image</text>
<text x="18" y="288" class="heading">Artwork title</text><text x="18" y="314" class="label">Artist · year</text><text x="18" y="340" class="muted">Description / missing-data note</text>
<rect class="button" x="16" y="370" width="218" height="55" rx="12"/><text x="73" y="403" class="label white">Save artwork</text>
</g>
<g transform="translate(660 100)">
<rect class="phone" width="250" height="490" rx="24"/>
<text x="18" y="38" class="heading">Saved works</text><text x="18" y="61" class="muted">Available without a connection</text>
<rect class="gold" x="16" y="82" width="218" height="96" rx="10"/><text x="29" y="116" class="label">Artwork · artist</text><text x="29" y="143" class="muted">Open details       Remove</text>
<rect class="gold" x="16" y="191" width="218" height="96" rx="10"/><text x="29" y="225" class="label">Artwork · artist</text><text x="29" y="252" class="muted">Open details       Remove</text>
<text x="50" y="440" class="label">Explore     Saved</text>
</g>
<path class="line" d="M305 355h40m265 0h40"/><text x="305" y="342" class="muted">tap</text><text x="610" y="342" class="muted">save</text>
</svg>
